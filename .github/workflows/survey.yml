name: survey

on:
  push:
    branches:
      - main
    paths:
      - "survey/**"
      - ".github/workflows/survey.yml"
  pull_request:
    paths:
      - "survey/**"
      - ".github/workflows/survey.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: survey-${{ github.ref }}
  # Only cancel superseded PR builds: never interrupt a release update.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile survey
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: survey

      - name: Rename PDF
        run: mv survey/main.pdf survey/neuron_addition_survey.pdf

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: survey-pdf
          path: survey/neuron_addition_survey.pdf

  publish:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download PDF artifact
        uses: actions/download-artifact@v4
        with:
          name: survey-pdf

      # Recreate the release so that the survey-latest tag points to the commit
      # the PDF was built from. The download URL stays the same.
      - name: Replace the survey-latest release
        run: |
          gh release delete survey-latest --cleanup-tag --yes || true
          gh release create survey-latest neuron_addition_survey.pdf \
            --target "$GITHUB_SHA" \
            --latest=false \
            --title "Survey (latest build)" \
            --notes "PDF compiled automatically from survey/ at commit $GITHUB_SHA. This release is replaced on every change to the survey sources."
